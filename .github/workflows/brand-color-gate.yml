name: brand-color-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Enforce NND-BRAND-COLOR-2026.1
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical brand policy
        shell: pwsh
        run: ./scripts/validation/validate-brand-colors.ps1

      - name: Run brand and storefront regressions
        shell: pwsh
        run: node --test ./tests/brand-color-policy.test.mjs ./tests/brand-palette.test.mjs ./tests/finance-commerce.test.mjs ./tests/privacy-consent.test.mjs ./tests/support-page.test.mjs
