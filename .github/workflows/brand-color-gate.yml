name: brand-color-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Enforce NND-BRAND-COLOR-2026.1
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate canonical brand policy
        shell: pwsh
        run: ./scripts/validation/validate-brand-colors.ps1

      - name: Run independent brand regression tests
        shell: pwsh
        run: node --test ./tests/brand-color-policy.test.mjs ./tests/brand-palette.test.mjs ./tests/vercel-deployment-gate.test.mjs
